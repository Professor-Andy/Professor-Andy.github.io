<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TWTH Lacey</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>


<nav aria-label="Main navigation">
    <a href="https://www.vvmf.org/The-Wall-That-Heals/" class="nav-hover nav-title">
        <img src="assets/logo.jpeg" alt="">
    </a>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <ol class="nav-list" id="navList">
        <li class="nav-hover"><a id="contact" onclick="Navigation('contact', 'Pages/Contact.html')">Contact</a></li>
        <li class="nav-hover"><a id="donate" onclick="Navigation('donate', 'Pages/Donate.html')">Donate</a></li>
        <li class="nav-hover"><a id="volunteer" href="https://www.signupgenius.com/go/10C0448ABA723A2F8C16-62993985-thewall">Volunteer</a></li>
        <li class="nav-hover"><a id="info" onclick="Navigation('info', 'Pages/Info.html')">Info</a></li>
        <li class="nav-hover"><a id="tour" onclick="Navigation('tour', 'Pages/Tour.html')">Tour</a></li>
        <li class="nav-hover"><a id="inMemory" onclick="Navigation('inMemory', 'Pages/InMemory.html')">In Memory</a></li>
    </ol>
</nav>


<div id="Page"></div>



<script src="scripts/image-slider.js"></script>
<script src="scripts/Navigation.js"></script>

<script>
    Navigation('info', 'Pages/Info.html');
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.getElementById("hamburger");
    const navList = document.getElementById("navList");
    const navLinks = navList.querySelectorAll("a");

    // Toggle menu open/close
    hamburger.addEventListener("click", () => {
        navList.classList.toggle("show");
    });

    // Close menu when any link is clicked
    navLinks.forEach(link => {
        link.addEventListener("click", () => {
            navList.classList.remove("show");
        });
    });
});
</script>

</body>
</html>
